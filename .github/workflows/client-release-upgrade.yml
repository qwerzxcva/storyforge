name: Verify signed Android release upgrade
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      client-artifact:
        description: 'Test the immutable client-android artifact produced by this release run'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  signed-apk-upgrade:
    permissions:
      contents: write # GitHub requires repository write access to read unpublished release assets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        if: ${{ inputs.client-artifact }}
        with:
          name: client-android
          path: release-test/current-client/
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore the permanent signing identity for the test runner
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/storyforge-fork-release.p12
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          [[ "$ANDROID_SIGNING_CERT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Fetch the last stable client APK and build the signed instrumentation runner
        env:
          GH_TOKEN: ${{ github.token }}
          USE_CLIENT_ARTIFACT: ${{ inputs.client-artifact }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release-test release/test-fixtures
          if [ "$USE_CLIENT_ARTIFACT" = true ]; then
            cp "release-test/current-client/StoryForge-$version-android.apk" release-test/upgrade-test-new.apk
          else
            gh release download "v$version" --pattern "StoryForge-$version-android.apk" --output release-test/upgrade-test-new.apk
          fi
          previous_tag=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease | node --input-type=module -e '
            let input = ""; for await (const chunk of process.stdin) input += chunk;
            const versions = JSON.parse(input).filter(row => !row.isDraft && !row.isPrerelease && /^v\d+\.\d+\.\d+$/.test(row.tagName));
            versions.sort((left, right) => {
              const a = left.tagName.slice(1).split(".").map(Number), b = right.tagName.slice(1).split(".").map(Number);
              return b[0] - a[0] || b[1] - a[1] || b[2] - a[2];
            });
            process.stdout.write(versions[0]?.tagName ?? "");
          ')
          if [ -n "$previous_tag" ]; then
            previous_version=${previous_tag#v}
            gh release download "$previous_tag" --pattern "StoryForge-$previous_version-android.apk" --output release-test/upgrade-test-old.apk
            git fetch origin "refs/tags/$previous_tag:refs/tags/$previous_tag"
            git worktree add "$RUNNER_TEMP/storyforge-previous" "$previous_tag"
            node scripts/desktop/build-upgrade-fixture.mjs "$RUNNER_TEMP/storyforge-previous" release/test-fixtures/native-upgrade-old.js "$previous_version"
          else
            previous_version=$version
            cp release-test/upgrade-test-new.apk release-test/upgrade-test-old.apk
            node scripts/desktop/build-upgrade-fixture.mjs . release/test-fixtures/native-upgrade-old.js "$version"
          fi
          PREVIOUS_CLIENT_VERSION=$previous_version node scripts/desktop/build-upgrade-fixture.mjs . release/test-fixtures/native-upgrade.js "$version"
          mkdir -p android/app/src/androidTest/assets
          cp release/test-fixtures/native-upgrade*.js android/app/src/androidTest/assets/
          (cd android && ./gradlew -PclientTestBuildType=release :app:assembleReleaseAndroidTest --no-daemon)
          cp android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk release-test/upgrade-test-runner.apk
          for apk in release-test/upgrade-test-old.apk release-test/upgrade-test-new.apk release-test/upgrade-test-runner.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > "$apk.certificate.txt"
            grep -Fq "Signer #1 certificate SHA-256 digest: $ANDROID_SIGNING_CERT_SHA256" "$apk.certificate.txt"
          done
      - name: Verify exact source before installing the new signed APK
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          python3 scripts/distribution/verify-android-source.py verify release-test/upgrade-test-new.apk --commit "$RELEASE_SOURCE_SHA" --tree "$(git rev-parse HEAD^{tree})" --version "$version" > release-test/source-check.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/distribution/test-release-apk-upgrade.sh
      - name: Freeze the exact upgrade-tested APK and four successful phases
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          python3 scripts/distribution/verify-android-source.py record-tested release-test/upgrade-test-new.apk --commit "$RELEASE_SOURCE_SHA" --tree "$(git rev-parse HEAD^{tree})" --version "$version" --preflight release-test/source-check.json --phases release-test > release-test/tested-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-android-release-input
          path: |
            release-test/upgrade-test-new.apk
            release-test/tested-release.json
            release-test/seed.txt
            release-test/baseline-restart.txt
            release-test/restore.txt
            release-test/restart.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-android-upgrade-evidence
          path: release-test/*.txt
          retention-days: 14
